# Static player-collision configuration.
#
# P5 replaces large-rock primitive fallbacks with reusable walkable mesh proxies
# and one BVH per prototype. Generated convex proxies remain visibly reported so
# authored COLLIDER_WALKABLE nodes can replace them asset by asset.
enabled: true
schemaVersion: 1

streaming:
  residentRadius: 1
  unloadRadius: 2
  prefetchSeconds: 0.5
  buildsPerFrame: 1
  buildBudgetMs: 2
  binSize: 12
  maxChunksPerCollider: 64

player:
  radius: 0.35
  bodyHeight: 1.8
  skinWidth: 0.03
  maxSlopeDegrees: 50
  maxSubstepDistance: 0.35
  maxIterations: 4

trees:
  enabled: true
  minimumTrunkRadius: 0.16
  # Prefer the configured asset id/scene path. Multi-prototype assets use #0, #1,
  # and so on. Generated prototypes fall back to "prototype:0" or numeric keys.
  # Supported fields: radius, height, centerX, centerZ, baseY.
  prototypeOverrides: {}

rocks:
  enabled: true
  minimumCollidableHeight: 0.3
  minimumCollidableWidth: 0.4
  minimumWalkableHeight: 0.7
  minimumWalkableWidth: 1.2
  maximumProxyTriangles: 96
  bvhMaxLeafTriangles: 4
  minimumProxyOverlapRatio: 0.35
  allowGeneratedProxyFallback: true
  requireAuthoredProxy: false
  # Keys use the configured asset id/scene path. Multi-prototype assets use #0,
  # #1, and so on. Supported fields: tier, shape, collisionScale.
  # tier: auto | decorative | blocking | walkable
  # shape: auto | sphere | ellipsoid | capsule | compound
  prototypeOverrides: {}

objects:
  enabled: true

constructions:
  enabled: true
  curveSegmentLength: 1.25

debug:
  colliders: false
  broadphase: false
  support: false
  contacts: false

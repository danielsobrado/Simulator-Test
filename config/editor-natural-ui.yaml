version: 1

storage:
  favoritesKey: drusniel:natural-ui:favorites
  recentKey: drusniel:natural-ui:recent
  hintKey: drusniel:natural-ui:hint-seen
  reducedMotionKey: drusniel:natural-ui:reduced-motion

limits:
  recentObjects: 8
  favoriteObjects: 16

motion:
  panelMs: 160
  toolbarMs: 140
  hintDurationMs: 9000

playerSettings:
  reducedMotionClass: natural-reduced-motion

selection:
  dragThresholdPx: 5
  maxVisibleOverlays: 128
  duplicateGapCells: 1

thumbnails:
  width: 128
  height: 92
  cameraFov: 28
  cameraPadding: 1.34
  maxMemoryEntries: 96
  rootMarginPx: 320
  idleTimeoutMs: 160
  idleDisposeMs: 2500
  fallbackVisibleCards: 24

primaryTools:
  - id: terrain
    label: Terrain
    controllerTool: terrain
    icon: terrain
  - id: nature
    label: Nature
    controllerTool: object
    objectCategory: nature
    icon: nature
  - id: build
    label: Build
    controllerTool: construction
    icon: build
  - id: decor
    label: Decor
    controllerTool: object
    objectCategory: civic
    icon: decor

buildActions:
  - id: wall
    label: Wall
    controllerTool: construction
    icon: wall
  - id: structures
    label: Structures
    controllerTool: object
    objectCategory: building
    icon: structures
  - id: defenses
    label: Defenses
    controllerTool: object
    objectCategory: defense
    icon: defense
  - id: workshop
    label: Procedural
    action: workshop
    icon: workshop

worldActions:
  - { id: save, label: Save }
  - { id: load, label: Load }
  - { id: new, label: Reset edits }

hints:
  firstRun: 'Drag the world directly. Click an object to select it. Shift-click selects more. Shift lowers terrain; Ctrl smooths.'
  terrain: 'Drag to paint or sculpt. Shift lowers. Ctrl smooths. Shift + wheel changes brush size.'
  build: 'Drag empty ground to draw a wall. Click a wall to edit it. Drag its handles directly.'

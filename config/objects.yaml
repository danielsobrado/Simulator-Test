# Placeable object catalog.
#
# `model` names a procedural model in src/editor/ObjectModelLibrary.js, which
# builds the object from primitives shaded with the shared procedural surface
# materials. An optional `asset` block points at a GLB node that replaces the
# procedural model once it loads; objects without one render procedurally.
objects:
  - key: cottage
    label: Cottage
    icon: "🏠"
    category: building
    color: "#b86b3f"
    model: cottage
    footprint: { width: 2, depth: 2 }
    foundation:
      mode: terrace
      maxSlopeDegrees: 18
      maxDepth: 3
      alignToNormal: false
      color: "#695442"
    allowedTerrain: [savanna, grassland, road, farm, hot_desert, cold_desert, tundra]

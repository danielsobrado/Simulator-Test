water:
  qualityTier: high
  # A thin anti-z-fighting lift; the former 12 cm lift read as a raised rim.
  heightOffset: 0.025
  currentAnimationSpeed: 0.22
  currentInfluence: 0.85
  interaction:
    enabled: true
  # Inland water after grass-test's (`WaterMaterial`, river and lake branch): a
  # dark, clear teal — `#246d70` lit, `#164e52` deep — over a bed it absorbs red
  # from first. The former bright cyan (#72d8e8 → #0b4a68) with a white cell
  # pattern over it was this project's own cartoon water.
  optics:
    shallowColor: '#246d70'
    deepColor: '#164e52'
    underwaterColor: '#10303d'
    # Pools read deeper toward the middle instead of one flat turquoise.
    absorptionDensity: 0.55
    minimumOpacity: 0.08
    maximumOpacity: 0.94
    shallowDepth: 0.2
    deepDepth: 3.5
    maximumOpticalDistance: 14
    minimumViewCosine: 0.22
    surfaceTransitionDepth: 0.75
    # Thickness over which the sheet fades out at the bank. Keep it under the
    # ~0.12 m the surface sits above terrain, or the waterline reads as a step.
    shorelineFadeDepth: 0.2
    # The cell pattern the donor never had.
    surfaceDetailStrength: 0
    underwaterTintStrength: 0.35
  refraction:
    enabled: true
    strength: 0.012
    coarseScale: 0.045
    fineScale: 0.16
    coarseSpeed: 0.05
    fineSpeed: 0.13
    depthFadeStart: 0.08
    depthFadeEnd: 1.8
    depthBiasMeters: 0.15
    mipLevel: 0
    sceneColorStrength: 0.94
    # The donor's silty lake/river absorption, 0.22/0.085/0.06 per unit at 2.8
    # units to the metre.
    absorptionCoefficients: [0.62, 0.24, 0.17]
  foam:
    enabled: true
    # The donor's calm river foam (#d6e7db): greener than white, lit with the scene.
    color: '#d6e7db'
    intensity: 0.6
    shoreWidth: 1.6
    noiseStrength: 0.42
    flowStrength: 0.12
    flowBandScale: 0.58
    flowBandSpeed: 0.42
    flowBandContrast: 2.4
    intersectionDepth: 0.08
    intersectionSoftness: 0.2
    intersectionStrength: 0.4
  # River falls and their plunge pools (placed by waterDomain.falls). Drawn with
  # the foam, so only at the qualities that draw foam.
  waterfall:
    enabled: true
    # Metres per second the strands stream down a fall face.
    fallSpeed: 6
    # One tile of the strand texture spans this many metres across and along.
    strandWidthMeters: 10
    strandLengthMeters: 4
    # Share of a fall face whitened by strands, plus an even white veil over all of it.
    faceCoverage: 0.75
    faceAeration: 0.35
    # Share of the plunge pool whitened right below a fall, fading downstream.
    plungeCoverage: 0.7
    plungeSpeed: 0.8
    plungeScaleMeters: 3
    # Spray over the falls nearest the viewer: at most mistMaxActive of them,
    # each within mistDrawDistance metres.
    mistEnabled: true
    mistDrawDistance: 650
    mistMaxActive: 6
    mistIntensity: 1
  # Open-sea swell: only water at the world's sea level with no current swells,
  # and it fades out in the shallows so the waterline stays put.
  sea:
    enabled: true
    # Clear salt water has its own depth palette and RGB absorption, rather
    # than inheriting the silty inland response. Values are per metre.
    optics:
      sunny: { lagoon: '#3caca8', shallow: '#25858e', deep: '#123d50' }
      storm: { lagoon: '#2f8a80', shallow: '#176662', deep: '#032d48' }
      absorptionCoefficients: [0.896, 0.182, 0.14]
      absorptionDensity: 0.22
      lagoonStart: 0.18
      lagoonEnd: 2.5
      deepStart: 0.71
      deepEnd: 8.6
      maximumOpticalDistance: 43
      fresnelStrength: 0.85
    # Offshore crest height in metres; a storm multiplies it by stormScale.
    amplitude: 0.9
    stormScale: 2.6
    choppiness: 4
    # No swell in water shallower than this; never taller than depthRatio of the depth.
    shallowDepth: 1.5
    depthRatio: 0.42
    # How much the unlit sheet brightens toward the sun on wave faces, and lifts at crests.
    slopeShading: 0.55
    crestLift: 0.12
    # Normalised crest height where whitecaps start, calm and in a storm.
    whitecapThreshold: 0.8
    stormWhitecapThreshold: 0.45
    # Light through a backlit crest (after grass-test's crest transmission): a wave
    # seen edge-on with the sun beyond it glows rather than reflecting. Zero turns
    # the term off and compiles nothing for it.
    crestTransmission: 0.5
    crestColor: '#8fd0a8'
    # Depth-following wave sets and breaking rolls; independent of coast orientation.
    surf:
      enabled: true
      fadeStart: 2.5
      fadeEnd: 7
      depthPhaseScale: 0.45
      setDepth: 0.5
      setGroup: 0.29
      alongFrequency: 0.031
      phaseWarp: 0.32
      breakDepthStart: 0.25
      breakDepthFull: 0.7
      breakDepthFade: 2.4
      breakDepthEnd: 4.5
      strength: 0.52
      trail: 7
      laceScale: 0.19
    # Crossing ripple trains ride the broad swell and disperse at their own speeds.
    detail:
      enabled: true
      textureWorldScale: 8
      mediumScale: 2.1
      fineScale: 5.7
      mediumDistance: 120
      fineDistance: 28
      mediumStrength: 0.14
      fineStrength: 0.055
      orbitalAdvection: 0.8
      advectionRatio: 0.9
  # Where the ground meets the sea: a swash film that runs up the sand and back
  # each wave, a foam line on its front, and wet sand behind it. Keyed on height
  # above sea level, so it follows any coast; lakes and rivers get none.
  coast:
    enabled: true
    sand:
      enabled: true
      dryDark: '#b39a72'
      dryLight: '#d6be96'
      seabedColor: '#efe6cf'
      seabedColorWeight: 0.3
      reefColor: '#426356'
      reefRockColor: '#6d7b68'
      reefStrength: 0.55
      # Light on the bed, not wire: at 0.65 the lattice read as white lines
      # across every wet beach.
      causticStrength: 0.25
    # Seconds per wave, and how far above still water it runs up the sand.
    period: 7.5
    runupHeight: 0.5
    # And how far it may run in metres from the still waterline. A height alone
    # reached 10-15 m over the flat banks of sea-level pools: foam lines on dry sand.
    runupMeters: 4
    # Depth in the shallows where the foam line forms.
    breakDepth: 0.5
    # Height over which the wash's edge fades. At 8 cm the film filled every
    # hollow of gently rippled sand and skipped the crests: glinting stripes.
    frontBand: 0.22
    foamCore: 0.02
    foamWidth: 0.12
    # A soft band, not a contour wire.
    foamCoreMeters: 0.08
    foamWidthMeters: 0.55
    breakupStrength: 0.8
    # How fast the wash memory of earlier waves dries, and the always-damp band.
    washDecay: 4
    dampHeight: 0.9
    wetDarkening: 0.5
    # Near matte, darkened rather than glossy: at 0.42 / 0.3 (and still faintly
    # at 0.75 / 0.6) the sun glinted off each stepped wash front as a white line.
    wetRoughness: 0.85
    filmRoughness: 0.8
    filmTint: '#8ccad0'
    filmTintStrength: 0.18
    foamColor: '#edf8fb'
    # Wash foam is a hint at the waterline; at 0.55 it whitened small pools
    # edge to edge.
    foamStrength: 0.3
  # grass-test's lake and river surface (`WaterMaterial`, inland branch): its detail
  # normals advected along the current, its Fresnel against its sky, its sun glint
  # (pow 170 × 1.8 + pow 20 × 0.08), and its foam — noise foam in the 0.02–0.75 m
  # shallows, a fringe along the banks, streaks where the current runs fast. It
  # replaces the shore and flow-band foam above; the sea keeps its own shading.
  riverSurface:
    enabled: true
    obstacles: true
    # Scales the donor's detail slopes (0.15 lake, 0.16 river, 0.025 micro).
    normalStrength: 0.5
    # Seconds per cross-fade of the two advected detail phases.
    cycleSeconds: 3
    # Metres per second the detail drifts on still water (the donor's lake), and
    # on a river at full current.
    stillDrift: 0.07
    currentDrift: 1.2
    # The donor river speed (its units per second) a full-strength current stands
    # for: turbulence streaks start at 0.7.
    fullCurrentSpeed: 3
    # Scales the donor's shore, bank and turbulence foam on inland water, apart
    # from `foam.intensity`, which is tuned for the sea's bands. At 1 the shore
    # band drew long white streaks across still ponds (biome-surface review).
    foamStrength: 0.45
    # Metres from the bank over which the bank foam fades out (donor 0.1–1.15).
    bankFoamWidth: 1.15
  # Rain rings on every water surface, as dense and bright as the rain is heavy.
  rainRipples:
    enabled: true
    strength: 0.45
  caustics:
    # The voronoi web concentrates its light into thin lines instead of
    # spreading it over a blob, so it needs a *lower* intensity than the old
    # FBM, not a higher one: at 0.5 the filaments read as cracked ice over the
    # whole shallows. Absorption thins it further with depth.
    # The donor's rivers carry no caustics.
    intensity: 0
    scale: 0.45
    speed: 0.34
    # Filament sharpness, not an exponent: the band is 1/contrast wide in the
    # distance field, so raising this thins the lines and darkens between them.
    contrast: 5
    depthFadeStart: 0.35
    depthFadeEnd: 4.5
  projectedCaustics:
    enabled: true
    color: '#b9f4e5'
    intensity: 0
    scale: 0.42
    speed: 0.55
    contrast: 2.6
    depthFadeStart: 0.15
    depthFadeEnd: 6
    maxDistance: 45

aquaticPlants:
  water:
    placement: rooted
    minimumCoverage: 0.55
    minimumDepth: 0.08
    maximumDepth: 3.2
    minimumShoreDistance: 0
    maximumShoreDistance: 14
    maximumCurrent: 1
    allowedKinds: [1, 2, 3]
  surface:
    placement: surface
    minimumCoverage: 0.7
    minimumDepth: 0.2
    maximumDepth: 2.6
    minimumShoreDistance: 0
    maximumShoreDistance: 12
    maximumCurrent: 0.1
    allowedKinds: [1, 2]

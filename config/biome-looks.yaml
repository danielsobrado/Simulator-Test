# Each biome's look, one row per terrain tile id: Azgaar's standard biomes are
# 0–12, and custom biomes take ids 32–254 (CLAUDE.md). Every layer that dresses
# a biome reads its column here, so a biome's palette and weather are tuned in
# one place (src/editor/biomes/BiomeLooks.js):
#
#   canopy        crown hue the trees wear (stylized/forest/forestLeafTint.js),
#                 a ratio against the species' own lit crown so its gradient
#                 survives. Unlisted biomes keep the species palette.
#   soil          the terrain's bare ground between the grass, in place of the
#                 Azgaar map colour (world/ChunkRenderPixels.js). Unlisted
#                 biomes keep the map colour.
#   snow.ground   snow lying at any height: the terrain bake, the far terrain
#                 and the grass gate (materials/SnowAccumulation.js).
#   snow.canopy   snow caps on the upward-facing foliage of trees and their
#                 impostors (stylized/forest/canopySnow.js).
#   snow.grass    frost on the meadow's blade tips, folded into the biome's
#                 grass palette (grass.meadow.palette in editor.config.yaml).
#   snow.air      snow-country air: a cooler, paler sky and haze, stopped-down
#                 exposure, diamond dust, spindrift, frost and breath, and the
#                 soundscape (stylized/sky/SnowCountryWeight.js).
#   snow.fall     regional snowfall (weather-effects.yaml `snowfall`), which
#                 starts at its `regionalMinCoverage`.
#   arid          bare ground dressed as rippled `sand` or frost-broken
#                 `mineral` (materials/AridSubstrateNodes.js).
#   crags         true grows crags and boulder clusters at any height, not only
#                 on high or snowy ground (stylized/alpine/AlpineRockView.js).
#   rock          the boulders and stones (stylized/rockWeathering.js): `tint`
#                 multiplies their albedo, `tone` brightens (>1) or darkens it
#                 (0.25..2), `moss` scales the configured moss (0 bare .. 2).
#                 Unlisted biomes keep the authored stone and the moss as set.
#   ripples       how water near the player answers wading, swimming and spells
#                 (water/RippleField.js): wave `speed` m/s, `fade` seconds for a
#                 ring to die, `splash` gain, ambient `drops` per second.
#   understory    shrubs, bushes and ground plants (stylized/AuthoredFoliageMaterial.js),
#                 per instance by the biome they stand in: greyed by `saturation`
#                 (0 grey .. 1 as graded .. 1.5), then `tint` x `tone` multiplies them.
#                 A shrub shared by several biomes otherwise wore one biome's
#                 green in all of them: dark juniper blobs on a pale steppe.
#   water         the region's water, sea and inland: `desaturate` (0..1) greys
#                 its colour toward its own luminance, then `tint` multiplies it.
#                 Cold country takes the tropical cyan out of its pools.
#   prints        footprints and spell craters (stylized/deformation): the share
#                 of bare `ground` taking them besides snow and beach, their
#                 `lifetime` in seconds and the `tint` pressed ground takes.
#   dunes         wind ripples on `arid: sand` ground: `wavelength` m (snapped
#                 to the pattern lattice), `wind` degrees, relief `height`,
#                 crest `sharpness` 0 (sine) .. 1 (steep lee face).
#   Ripples and prints follow the biomes round the player and blend over a
#   second or two (biomes/BiomeSurfaceResponse.js); `surface` holds their
#   defaults. Columns resolve in biomes/BiomeSurfaceLooks.js.
#
# Above the terrain's snow line (terrain-material-bake.yaml) every snow column
# reaches 1 whatever the biome. Values are 0..1; unlisted columns are 0.
biomeLooks:
  snow:
    # Snow on foliage, lit; its shade takes the sky's cool fill.
    color: '#eef3f8'
    # The frost the meadow's tips lean toward, a little warmer than snow so a
    # frosted stand still reads as grass.
    frost: '#d9e0e2'
  surface:
    ripples: { speed: 1.4, fade: 3, splash: 1, drops: 0 }
    prints: { ground: 0, lifetime: 90, tint: '#b8ada3' }
  byTileId:
    # Erg: long, sharp-crested ripples; an oasis's still water carries a ring
    # far and slow. Prints blow back in within half a minute.
    1:
      name: hot desert
      arid: sand
      # Sun-bleached, sand-scoured stone: no moss survives the erg.
      rock: { tint: '#e6cfa8', tone: 1.1, moss: 0 }
      # Sun-baked scrub: olive-straw, never lawn green.
      understory: { tint: '#e2d3a6', tone: 1.1, saturation: 0.55 }
      ripples: { speed: 1.1, fade: 6, splash: 1.2 }
      prints: { ground: 0.9, lifetime: 30, tint: '#8c7458' }
      dunes: { wavelength: 0.22, wind: 18, height: 2, sharpness: 0.75 }
    # Cold steppe: bare ground with snow lying in the hollows.
    2:
      name: cold desert
      # Grey-buff steppe gravel and dusty sage crowns: the map's ochre and the
      # species' summer green read as a hot desert (2026-11-05 review). Graded
      # crowns follow the canopy at ratio^0.3, so the target sits well past sage.
      canopy: '#7f8466'
      soil: '#9a9282'
      arid: mineral
      # Frost-shattered stone; moss read as a green wash on a dry steppe. At tone
      # 1.1 the stones read near-white against the ground.
      rock: { tint: '#d6cbb8', tone: 0.95, moss: 0 }
      # Steel-grey meltwater: the lagoon cyan read as a tropical oasis.
      water: { tint: '#c6d2d8', desaturate: 0.5 }
      # Dusty sage steppe scrub, pale enough to sit on the grey-buff gravel.
      understory: { tint: '#d2d4bc', tone: 1.15, saturation: 0.45 }
      snow: { ground: 0.2, air: 0.3, fall: 0.3 }
      ripples: { speed: 1.6, fade: 1.8 }
      prints: { ground: 0.5, lifetime: 120, tint: '#a9a49c' }
    # Dry-season savanna: tawny laterite under straw grass, muddy waterholes.
    # With the map colour underneath it read as a green English meadow, the
    # lagoon cyan as a tropical oasis and tone 1.1 stones near-white (2026-11-06 review).
    3:
      name: savanna
      canopy: '#aeae5a'
      soil: '#a8865a'
      rock: { tint: '#e0c9a6', tone: 0.9, moss: 0 }
      water: { tint: '#c8bf98', desaturate: 0.45 }
      # Dry-season thorn scrub, olive going to straw.
      understory: { tint: '#e6d6a0', tone: 1.05, saturation: 0.7 }
      prints: { ground: 0.4, lifetime: 90, tint: '#8a6a48' }
    4: { name: grassland, canopy: '#86b04a' }
    5: { name: tropical seasonal forest, canopy: '#6fae3e' }
    6: { name: temperate deciduous forest, canopy: '#6da03c' }
    # Canopy drip keeps rainforest pools stippled with rings.
    7: { name: tropical rainforest, canopy: '#3f8f34', rock: { moss: 1.4 }, ripples: { drops: 6, fade: 2.2 } }
    8: { name: temperate rainforest, canopy: '#4c9142', rock: { moss: 1.4 }, ripples: { drops: 4, fade: 2.4 } }
    # Boreal forest in its winter: peat and needle litter, snow only in the
    # hollows, along the tops of the crowns and as frost on the grass. Ground
    # snow at 0.3 lay as a thin grey film over the map colour, reading as bare
    # concrete round every town. `fall` stays below the snowfall's
    # regionalMinCoverage (weather-effects.yaml), so taiga alone never snows:
    # at 0.45 the field switched on there and the taiga chunk-cross ran at
    # 54 / 49 fps against 69 with biome snow off (2026-10-20). Tundra and
    # glacier next door still snow over it.
    9:
      name: taiga
      canopy: '#4a7a55'
      soil: '#3d3a2b'
      water: { tint: '#bccaca', desaturate: 0.35 }
      snow: { ground: 0.1, canopy: 0.7, grass: 0.35, air: 0.4, fall: 0.15 }
      ripples: { speed: 1.5, fade: 2 }
      prints: { ground: 0.35, lifetime: 150, tint: '#9c9488' }
    # A snow carpet, the odd tussock breaking it; trees wear full caps. At 0.8
    # the drift noise left a wash of grass and heather through most of the snow.
    10:
      name: tundra
      canopy: '#8a9a62'
      rock: { tint: '#d6d8d4', tone: 1, moss: 0.35 }
      water: { tint: '#c8d6de', desaturate: 0.45 }
      # Dwarf willow and heath, frost-dulled.
      understory: { tint: '#d0d6c8', tone: 1.05, saturation: 0.6 }
      snow: { ground: 0.95, canopy: 0.95, grass: 0.8, air: 0.7, fall: 0.75 }
      # Near-freezing meltwater: thick, quick to still.
      ripples: { speed: 0.8, fade: 0.9, splash: 0.7 }
      prints: { lifetime: 240 }
    11:
      name: glacier
      rock: { tint: '#d4dbe2', tone: 1.05, moss: 0 }
      water: { tint: '#d0dee8', desaturate: 0.4 }
      understory: { tint: '#d6dde2', tone: 1.1, saturation: 0.4 }
      # No grass grows on the ice (grass.meadow.growth), so it takes no frost:
      # a frosted palette would spend one of the meadow's eight for nothing.
      snow: { ground: 1, canopy: 1, air: 1, fall: 1 }
      # Slush: a splash barely spreads before the ice-laden water swallows it,
      # and a print in the snowfield stays for minutes.
      ripples: { speed: 0.45, fade: 0.5, splash: 0.5 }
      prints: { lifetime: 360, tint: '#b4c4d8' }
    # Swamp giants: dark, olive-black leaves under the bog overcast.
    # Peat and moss between the sedge, not the map's bright marsh green.
    # Sluggish bog water, always stippled by insects and gas; deep mud prints.
    12:
      name: wetland
      canopy: '#3f5434'
      soil: '#2c3120'
      rock: { moss: 1.5 }
      # Peat-stained bog water.
      water: { tint: '#b0a68c', desaturate: 0.4 }
      ripples: { speed: 0.9, fade: 1.6, splash: 0.8, drops: 10 }
      prints: { ground: 0.8, lifetime: 200, tint: '#6e665a' }
    # Stonehold Badlands, the first custom biome of an Eldara import
    # (import.azgaarRegionalBiomes): grey mesas and canyons, pale wind-blown sand
    # on the floors, frost in the hollows of a cold realm.
    32:
      name: stonehold badlands
      soil: '#b3a68c'
      arid: sand
      crags: true
      # Grey canyon stone, dusted pale; nothing grows on it.
      rock: { tint: '#cfc8bc', tone: 1.05, moss: 0 }
      water: { tint: '#c8c4b8', desaturate: 0.4 }
      understory: { tint: '#d8ccb0', tone: 1.1, saturation: 0.5 }
      snow: { ground: 0.05, air: 0.2 }
      # Coarse grey canyon sand: short, choppy ripples across the wind.
      ripples: { speed: 1.3, fade: 4 }
      # Dark enough to read on the grit floor scan, whose own light/dark stones hid
      # a lighter print entirely (docs/qa/biome-surface/2026-11-04/review-pass4.md).
      prints: { ground: 0.85, lifetime: 45, tint: '#3a322a' }
      dunes: { wavelength: 0.14, wind: -35, height: 1.3, sharpness: 0.45 }

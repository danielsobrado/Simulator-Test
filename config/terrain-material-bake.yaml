schemaVersion: 1
enabled: true
quality: balanced

qualityTiers:
  low:
    resolution: 32
  balanced:
    resolution: 64
  high:
    resolution: 128

channels:
  macroTint:
    format: rgba8unorm
  terrainShape:
    # R = slope, G = signed curvature.
    format: rg16float
  materialWeights:
    # Grass/dirt/rock/snow weights; consumers renormalize after filtering.
    format: rgba8unorm
  wetnessShoreline:
    # R = wetness, G = shoreline influence.
    format: rg8unorm
  farColor:
    format: rgba8unorm-srgb
  farNormal:
    # Octahedral XY normal encoding.
    format: rg8snorm
  canopyWater:
    # R = canopy coverage, G = water coverage.
    format: rg8unorm

build:
  # Yield during CPU material analysis so a high-quality page cannot monopolize a frame.
  rowsPerYield: 16
  maxConcurrent: 2
  retryDelayMs: 1000

classification:
  rockSlopeStart: 0.18
  rockSlopeFull: 0.62
  snowLine: 26
  snowFade: 8
  snowSlopeMax: 0.55
  shorelineRadiusCells: 4
  wetnessRadiusCells: 2

macro:
  scaleMeters: 120
  strength: 0.14
  seedOffset: 2401
  heightShadeScale: 0.018
  minHeightShade: 0.72
  maxHeightShade: 1.22
  wetDarkening: 0.18

families:
  enabled: true
  seed: 7717
  resolution: 64
  variantsPerFamily: 4
  # Meso uses the shared stochastic atlas; micro is an independent analytic field.
  mesoScaleMeters: 3.8
  microScaleMeters: 0.42
  variantCellMeters: 18
  scaleJitter: 0.18
  strength: 0.36
  nearStrength: 0.55
  dominantFadePower: 1.6
  secondaryBlendStrength: 0.85
  secondaryMinWeight: 0.08
  mesoStrength: 0.24
  microStrength: 0.06
  microFadeStartDistance: 28
  microFadeEndDistance: 85
  projection:
    # Flat ground uses world XZ. Steep ground switches to its dominant vertical plane.
    slopeStart: 0.22
    slopeFull: 0.58
    verticalScale: 0.85
  environment:
    # Wet and shaded ground retains structure but suppresses harsh high-frequency contrast.
    wetDetailScale: 0.72
    canopyDetailScale: 0.86
  profiles:
    grass:
      contrast: 0.26
      coarseFrequency: 3
      fineFrequency: 11
      fineStrength: 0.42
      ridgeFrequency: 7
      ridgeStrength: 0.08
      directionalFrequency: 5
      directionalStrength: 0.10
      direction: [0.86, 0.51]
      colorSpread: 0.035
      roughness: 0.88
      wetRoughness: 0.68
    dirt:
      contrast: 0.34
      coarseFrequency: 4
      fineFrequency: 13
      fineStrength: 0.55
      ridgeFrequency: 5
      ridgeStrength: 0.18
      directionalFrequency: 3
      directionalStrength: 0.12
      direction: [0.60, -0.80]
      colorSpread: 0.050
      roughness: 0.94
      wetRoughness: 0.60
    rock:
      contrast: 0.42
      coarseFrequency: 3
      fineFrequency: 17
      fineStrength: 0.38
      ridgeFrequency: 6
      ridgeStrength: 0.55
      directionalFrequency: 4
      directionalStrength: 0.32
      direction: [0.92, 0.38]
      colorSpread: 0.025
      roughness: 0.78
      wetRoughness: 0.50
    snow:
      contrast: 0.16
      coarseFrequency: 2
      fineFrequency: 9
      fineStrength: 0.24
      ridgeFrequency: 4
      ridgeStrength: 0.08
      directionalFrequency: 2
      directionalStrength: 0.06
      direction: [0.40, 0.92]
      colorSpread: 0.012
      roughness: 0.92
      wetRoughness: 0.76

render:
  # Near keeps full procedural detail; mid uses baked material classes; far uses baked color.
  nearDistance: 90
  farDistance: 260
  transitionDistance: 32
  publishFadeMs: 240
  grassTintStrength: 0.36
  nearMacroStrength: 0.32
  nearMaterialBlend: 0.14
  nearWetnessScale: 0.45
  staleProceduralBlend: 0.35
  wetDarkening: 0.16
  shorelineStrength: 0.12
  canopyStrength: 0.30
  fallbackRoughness: 0.90
  rockColor: '#8d9195'
  snowColor: '#e8eef2'
  shorelineColor: '#59604f'

cache:
  maxEntries: 192
  maxBytes: 100663296
  staleWhileRevalidate: true

fallback:
  allowProcedural: true
  allowStale: true

debug:
  view: final

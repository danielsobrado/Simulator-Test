schemaVersion: 1
enabled: true
quality: balanced

qualityTiers:
  low:
    resolution: 32
  balanced:
    resolution: 64
  high:
    resolution: 128

channels:
  macroTint:
    format: rgba8unorm
  terrainShape:
    # R = slope, G = signed curvature.
    format: rg16float
  materialWeights:
    # Grass/dirt/rock/snow weights; consumers renormalize after filtering.
    format: rgba8unorm
  wetnessShoreline:
    # R = wetness, G = shoreline influence.
    format: rg8unorm
  farColor:
    format: rgba8unorm-srgb
  farNormal:
    # Octahedral XY normal encoding.
    format: rg8snorm
  canopyWater:
    # R = canopy coverage, G = water coverage.
    format: rg8unorm

build:
  # Yield during CPU material analysis so a high-quality page cannot monopolize a frame.
  rowsPerYield: 16
  maxConcurrent: 2
  retryDelayMs: 1000

classification:
  rockSlopeStart: 0.18
  rockSlopeFull: 0.62
  snowLine: 26
  snowFade: 8
  snowSlopeMax: 0.55
  shorelineRadiusCells: 4
  wetnessRadiusCells: 2

macro:
  scaleMeters: 120
  strength: 0.14
  seedOffset: 2401
  heightShadeScale: 0.018
  minHeightShade: 0.72
  maxHeightShade: 1.22
  wetDarkening: 0.18

render:
  # Near keeps full procedural detail; mid uses baked material classes; far uses baked color.
  nearDistance: 90
  farDistance: 260
  transitionDistance: 32
  grassTintStrength: 0.36
  nearMacroStrength: 0.32
  nearMaterialBlend: 0.14
  nearWetnessScale: 0.45
  staleProceduralBlend: 0.35
  wetDarkening: 0.16
  shorelineStrength: 0.12
  canopyStrength: 0.30
  rockColor: '#666b67'
  snowColor: '#dce3e4'
  shorelineColor: '#59604f'

cache:
  maxEntries: 192
  maxBytes: 100663296
  staleWhileRevalidate: true

fallback:
  allowProcedural: true
  allowStale: true

debug:
  view: final

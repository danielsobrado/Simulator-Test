# Optional quality features. These are deliberately independent of world generation.
detailVisibility: false
detailTurnMarginDegrees: 12
surfaceAnisotropy:
  enabled: true
  level: 16
waterReflections:
  enabled: true
  planar: true
  resolution: 256
  intervalMs: 500
  reachMeters: 96
shadowCascades: 1
# Trial (coherence-polish plan, stage 6): near tree crowns cast sun shadows, for
# shade and dapple under a wood. Off until measured; A/B with ?crownShadows=1.
crownShadows: false
snowRelief: true
roadsideLanterns: false

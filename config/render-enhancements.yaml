# Optional quality features. These are deliberately independent of world generation.
detailVisibility: false
detailTurnMarginDegrees: 12
surfaceAnisotropy:
  enabled: true
  level: 16
waterReflections:
  enabled: true
  planar: true
  resolution: 256
  intervalMs: 500
  reachMeters: 96
shadowCascades: 1
# Coherence-polish plan, stage 6: near tree crowns cast sun shadows, for shade
# and dapple under a wood. On since 2026-11-11 from the evenly lit forest floors
# in that day's captures, but its frame cost is NOT measured yet: A/B against
# ?crownShadows=0 at the forest and town poses. It may go a little over the
# stage budget, but turn it off if those poses do not stay above 60 FPS.
crownShadows: true
snowRelief: true
roadsideLanterns: false

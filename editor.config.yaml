map:
  tileSize: 2
  defaultTile: grassland
  chunkSize: 32
import:
  azgaarAtlasLongEdge: 2000
  azgaarOceanTransitionKilometers: 50
  # Imported Azgaar worlds can be thousands of km wide, which flattens real
  # mountain ranges to invisibility. These rescale imported land elevation into
  # dramatic, walkable mountain country without shrinking the world.
  # verticalExaggeration multiplies land height (peaks reach ~2 km at 48);
  # reliefExponent > 1 concentrates height into peaks so plains stay flat.
  # Both default to 1 (no rescale) when omitted.
  azgaarVerticalExaggeration: 48
  azgaarReliefExponent: 1.5
  # Ridged crests, spurs and gullies on high ground (world/MountainRidges.js),
  # stamped into the world at import: re-import for a change to apply.
  # heightMeters is crest over gully at full strength; the relief fractions
  # (0 coast … 1 highest peak) set where ridges begin and reach full strength.
  # couloirMeters is how deep the rock chutes between the ribs cut at full
  # strength, and notchMeters how deep a saddle cuts the ridge line. Both are
  # conservative fine detail over the 90 m ridges and both are additive: 0 turns
  # a term off, and removing a key leaves a world imported before it the same.
  # Remove the block to import smooth mountains.
  azgaarRidges:
    heightMeters: 90
    startRelief: 0.3
    fullRelief: 0.65
    couloirMeters: 8
    notchMeters: 9
  # Azgaar roads and trails graded into walkable paths (world/TrailGrading.js):
  # the ground along each is cut and filled toward a profile no steeper than
  # maxGrade, within maxCut/maxFill, with banks that widen with the cut.
  # Stamped at import like the ridges; remove the block to import ungraded.
  azgaarTrails:
    roadWidthMeters: 6
    trailWidthMeters: 3
    maxGrade: 0.14
    stepMeters: 8
    arcMeters: 1024
    maxCutMeters: 10
    maxFillMeters: 4
    shoulderMeters: 3
    bankSlope: 1.4
world:
  seed: 918273
  generatorVersion: 1
  chunkSize: 64
  loadRadius: 2
  unloadRadius: 3
  prefetchSeconds: 1.5
  maxResidentChunks: 49
  maxCpuChunks: 81
  floatingOriginThreshold: 4096
  minimapCells: 192
  # Keeps new procedural worlds visibly rolling around the starting chunks.
  # The generator remains deterministic and continuous across chunk borders.
  heightScale: 24
  seaLevel: -1.5
  maxCommitsPerFrame: 1
  maxCommitsPerFrameIdle: 4
  commitBudgetMs: 2
  # Coarse distant-terrain backdrop for imported Azgaar worlds. Streamed chunks
  # only cover a small radius; this fills the horizon with continents and
  # mountains sampled from the in-memory macro atlas. It follows the floating
  # origin and rebuilds only when the origin snaps, so it does not affect chunk
  # streaming. Set enabled:false to disable.
  farTerrain:
    enabled: true
    radiusMeters: 60000
    heightBias: 15
    # Polar grid, graded toward the camera. A uniform grid at this radius spent
    # ~750 m per vertex in the near band and made peaks read as blobs; grading
    # cuts that several-fold for the same vertex budget, with no ring seams.
    # innerRadiusMeters sits inside the streamed chunk area so no gap shows.
    innerRadiusMeters: 256
    radialResolution: 160
    angularResolution: 256
    radialFalloff: 2.2
    # Origin-snap rebuilds are sliced this many rings per frame into a back
    # buffer, then swapped, so a snap cannot spike a frame or tear the mesh.
    rebuildRowsPerFrame: 24
    # Slope reveals rock then bare stone; snow settles above the line, and in
    # the snowy biomes at any height (config/biome-looks.yaml snow.ground), but
    # not on faces too steep to hold it.
    # Keep in step with config/terrain-material-bake.yaml classification.
    rockColor: '#8d9195'
    screeColor: '#6d7175'
    snowColor: '#e8eef2'
    snowLine: 700
    snowFade: 250
    snowSlopeMax: 0.55
    rockSlopeStart: 0.18
    rockSlopeFull: 0.62
camera:
  viewSize: 180
  minZoom: 0.3
  maxZoom: 6
  damping: 0.1
player:
  fovDegrees: 68
  walkSpeed: 9
  runMultiplier: 1.8
  jumpSpeed: 8
  gravity: 24
  eyeHeight: 1.7
  stepHeight: 1.1
  groundSnapDistance: 0.6
  mouseSensitivity: 0.0022
  maxPitchDegrees: 85
objects:
  lod:
    enabled: true
    nearPixels: 140
    coarsePixels: 35
    hysteresisRatio: 0.15
    transitionMs: 240
    fadeSteps: 16
    evaluationHz: 30
    near:
      castShadow: true
    coarse:
      castShadow: true
    shell:
      castShadow: false
renderer:
  # Keep MSAA off. With ACES tone mapping, three.js renders into an internal
  # MSAA target when antialias is true; materials that sample
  # viewportDepthTexture then bind a 1x1 non-MSAA depth stub against a
  # multisampled bind layout (GPUValidationError: Sample count / multisampled).
  # Temporal AA under stylizedSurface.postProcessing.antiAliasing is the AA path.
  antialias: false
  forceWebGL: false
  maxPixelRatio: 2
  # 'high-performance' picks the discrete GPU on hybrid machines. Set to
  # 'low-power' only to deliberately trade frame rate for battery.
  powerPreference: high-performance
  # ACES exposure. Kept equal to the workshop preview renderer so a baked
  # building looks the same placed in the world as it did while authoring.
  toneMappingExposure: 1.12
  # Same-frame Hi-Z occlusion culling, ported from grass-test. It renders the scene's
  # solid occluders into a half-resolution depth target, builds a max-depth pyramid,
  # and zeroes the drawn count of whole draws that sit entirely behind them. Off is
  # the plain frame. `diagnostics` reads the culled triangle counts back to the CPU
  # for QA only — the editor runtime keeps that off (see webGpuRuntimeContract).
  #
  # Off by default on measurement (2026-09-28, walking, vsync off): it works — the
  # terrain occludes through per-chunk proxies of its hills (terrainOccluderProxy)
  # and in an Eldara valley it hid 5–7 draws / ~57k triangles behind relief — but
  # it cost 1–9% frame rate there (255–270 fps on, 264–281 off) and ~5% on open
  # ground where it culled nothing (151–154 vs 160–162). The draws that cost the
  # most are not candidates: the meadow is one batch per band across every tile,
  # and trees and rocks are wind-displaced instanced meshes. Turn it on for a scene
  # whose heavy, solid meshes sit behind hills or walls.
  gpuOcclusion:
    enabled: false
    resolutionScale: 0.5
    minTriangles: 256
    boundsPadding: 0.15
    minSavedTriangles: 25000
    minSavedTrianglesPerMs: 50000
    probeInterval: 30
    diagnostics: false
terrain:
  minHeight: -16
  maxHeight: 48
  sculptStrength: 1.25
  smoothFactor: 0.45
stylizedSurface:
  enabled: true
  # Gods' End's powder/compaction response. Appearance only: Azgaar terrain IDs
  # and the material bake still decide where snow lies.
  snowSurface:
    calmScale: 34
    calmCoverage: 0.5
    calmRelief: 0.25
    calmDetail: 0.45
    windward: 0.6
    pathCompaction: 0.85
    pathColor: '#a3b4c9'
    baseRoughness: 0.7
    compactedRoughness: 0.4
    toneContrast: 0.06
    # Fresh snow is clean: strong cavities read as marble or concrete.
    cavityStrength: 0.2
    subsurfaceStrength: 0.12
    # Share of the lit colour left in a drift's cast shadow, before its blue shade tint.
    driftShadow: 0.18
    # Share of the Snow007 grain and sastrugi slopes kept: a low sun rakes them into scratches.
    fineNormal: 0.35
    # How far snow normals lean to a low sun. At 7° real snow glows gold; plain
    # N·L left it in the blue fill, and leaning keeps the shadow map, which emission would not.
    lowSunWrap: 0.85
  # The trail a walking body cuts through deep snow (grass-test's SnowSurfWake):
  # a banked trench that widens and deepens with speed and settles flat within
  # 25 s. Terrain-only and gated on baked snow, on a live trail and on a circle
  # around it, so anywhere else it costs one compare. false compiles nothing.
  snowWake:
    enabled: true
  # The walking frame's finish, ported from grass-test's cinematic pipeline
  # (stylized/cinematicFinish.js): bloom, then a filmic grade in linear light ahead
  # of the tone mapper. The walking view renders through the god-rays pipeline,
  # which returns before `postProcessing` below, so this is where the grade lives.
  # Values are the donor's `cinematic.post`.
  cinematicFinish:
    enabled: true
    saturation: 1.04
    contrast: 1.12
    lift: [0.004, 0.006, 0.012]
    gain: [1.02, 1.0, 0.97]
    highlightDesaturation: 0.35
    vignette: 0.10
    grain: 0.006
    bloom:
      strength: 0.09
      radius: 0.3
      threshold: 2.1
  postProcessing:
    enabled: true
    preset: balanced
    renderScale: 1.0
    antiAliasing:
      enabled: true
      mode: traa
      jitterSamples: 8
      feedback: 0.90
      varianceGamma: 1.25
      depthRejectionMinMeters: 0.05
      depthRejectionScale: 0.02
      reactiveStrength: 0.90
      motionRejectionPixels: 32
      historyClampStrength: 1.0
    bloom:
      enabled: true
      intensity: 0.18
      threshold: 3.0
      knee: 1.4
      levels: 4
      bloomBoost: 3.0
    toneMapping:
      enabled: true
      mode: agx
      exposure: 1.0
      contrast: 1.0
      saturation: 1.0
    sharpen:
      enabled: true
      amount: 0.22
    ssr:
      enabled: false
      resolutionScale: 0.5
      maxSteps: 32
      binarySteps: 5
      maxDistanceMeters: 80
      thicknessMeters: 0.35
      roughnessCutoff: 0.45
      intensity: 0.60
      temporalFeedback: 0.85
      edgeFade: 0.08
    screenSpaceShafts:
      enabled: true
      resolutionScale: 0.5
      samples: 24
      intensity: 0.40
      reach: 0.82
      decay: 0.955
      highSunFadeStartDegrees: 35
      highSunFadeEndDegrees: 55
    depthOfField:
      enabled: false
      focusMode: player
      manualFocusMeters: 6.2
      focusSmoothing: 4.0
      maxCoCPixels: 3.5
      taps: 16
      nearStartRatio: 0.55
      nearFullRatio: 0.16
      farStartMeters: 130
      farFullMeters: 620
    vignette:
      enabled: false
      intensity: 0.12
      innerRadius: 0.35
      outerRadius: 1.05
    grain:
      enabled: false
      intensity: 0.012
    diagnostics:
      enabled: false
      debugView: final
      showGpuTimings: false
  assets:
    scene: /assets/grass-scene.glb
    trunkMaterial: Material.011
    leafMaterial: 2237f4d60830642a24d65276e7abe1e6
    # Primary-scene pines kept out of the conifer pools: 3 is a bare, broken
    # stem and 4 a crooked trunk with two tufts; both read as wrong, dead-looking
    # trees among full crowns. Indices follow the scene's extraction order.
    excludePrimaryTreePrototypes: [3, 4]
    # The primary pines' crown on the shared canopy grade and foliage lighting,
    # as every authored crown: on the palette they stood near black beside lit
    # broadleaves. Its authored alpha cutoff (0.61) ate the needles; part of the
    # impostor signature, so changing this needs a rebake.
    primaryLeaf: { gain: 2, alphaTest: 0.35 }
    # Authored scatter prototypes retain their embedded diffuse/normal textures.
    # Per-file scales normalize the source packages into metre-sized scenery.
    # grass-test's stones (scripts/prepare-donor-rock-assets.mjs): the eleven
    # `SM_Rocks_NN` of its stylized pack under one painted-stone material, each a
    # prototype of its own. The donor scales the pack ×7 in its units, 2.8 to the
    # metre: 2.5 here. They replace the former mixed set, kept below to restore.
    rockVariants:
      - scene: /assets/rocks/donor/rocks.glb
        scale: 2.5
    # Former set:
    #   - scene: /assets/rocks/rock.glb
    #     scale: 0.02
    #   - scene: /assets/rocks/obj_nat_rock_01.glb
    #     scale: 0.012
    #   - scene: /assets/rocks/a_simple_rock.glb
    #     scale: 1
    #   - scene: /assets/rocks/ruined-fence/stone-01.glb
    #     scale: 1
    #   - scene: /assets/rocks/ruined-fence/stone-03.glb
    #     scale: 1
    #   - scene: /assets/rocks/ruined-fence/stone-06.glb
    #     scale: 1
    #   - scene: /assets/rocks/ruined-fence/stone-08.glb
    #     scale: 1
    #   - scene: /assets/rocks/3d_scan_rock.glb
    #     scale: 0.045
    #   # Four curated stones extracted offline from the forest showroom. The
    #   # other five remain individual library assets without entering residency.
    #   - scene: /assets/rocks/forest-pack/rock-02.glb
    #     scale: 1
    #   - scene: /assets/rocks/forest-pack/rock-04.glb
    #     scale: 1
    #   - scene: /assets/rocks/forest-pack/rock-06.glb
    #     scale: 1
    #   - scene: /assets/rocks/forest-pack/rock-08.glb
    #     scale: 1
    # Undergrowth by biome and by light. Without tileIds every shrub grew
    # everywhere — bamboo thickets in taiga — and every variant blocked on load.
    # `canopy` sorts them by shade: the low shrub is the shade-tolerant floor of
    # a wood's interior, the rounded bush rings its sunlit fringe, and the open
    # scrub stands out in glades and on savanna. The first tile id picks the
    # foliage grade (forest/foliagePalette.js), so shared shrubs lead with a
    # temperate biome rather than wearing savanna gold everywhere.
    bushVariants:
      - scene: /assets/bushes/stylized_bush.glb
        motion: woody-shrub
        scale: 1
        weight: 1.2
        tileIds: [6, 3, 4, 5, 8, 14]
        canopy: edge
      - scene: /assets/bushes/small_bush.glb
        motion: woody-shrub
        scale: 2
        weight: 1.3
        tileIds: [6, 3, 4, 5, 7, 8, 9, 14]
        canopy: core
      - scene: /assets/bushes/bush2.glb
        motion: woody-shrub
        scale: 0.5
        weight: 1
        tileIds: [4, 5, 6, 7, 8, 14]
        character: forest
      - scene: /assets/bushes/bush.glb
        motion: woody-shrub
        scale: 1
        weight: 1
        tileIds: [4, 3, 6, 9, 14]
        character: scrub
        canopy: open
      - scene: /assets/bushes/bamboo_bush.glb
        motion: flexible-stem
        scale: 0.006
        weight: 1.4
        tileIds: [7, 5]
    # Additional authored tree prototypes. Their embedded textures are retained
    # and each entry joins the configured species' deterministic prototype pool.
    treeVariants:
      - scene: /assets/trees/stylized-oak.glb
        trunkMaterial: trunk_Mat.001
        leafMaterial: leafes_Mat.001
        species: broadleaf_round
        # Deterministic CLOD bark synthesis, projected in object space so the
        # trunk and branches share one consistent fissured surface.
        barkProfile: spruce
        barkScale: 0.8
        barkSeed: 83
        # Unit conversion, grounding and centring are baked by the offline extractor.
        scale: 1
        # Still the heaviest tree in the pool by an order of magnitude after
        # offline decimation (182 154 -> 62 883 triangles; its crown is thousands
        # of disconnected leaf shells that no simplifier will collapse further).
        # Confined to the two biomes that place trees as isolated specimens and
        # copses — savanna at density 0.24 and grassland at 0.16 — where a hero
        # oak is what the composition wants and where few of them are drawn.
        # Closed forest uses the 4 599- and 1 806-triangle crowns below.
        # Grassland now wears grass-test's meadow trees; the oak keeps the savanna.
        tileIds: [3]
      - scene: /assets/trees/forest-pack/tree-wide-01.glb
        trunkMaterial: Tree_Trunk_01
        leafMaterial: Tree_Branches_01
        species: conifer_wide
        scale: 1
        leafGain: 2
      # Two more distinct conifer crowns from the same pack, 630 and 624
      # triangles. Verified distinct rather than transforms of tree-wide-01.
      # Both are broad, broadleaf-shaped crowns on a 1.8 m low-poly stem, so they
      # stay in temperate rainforest. Preferring the pack in taiga also shut out
      # the primary spruces there, and a boreal wood grew oak silhouettes.
      - scene: /assets/trees/forest-pack/tree-wide-02.glb
        trunkMaterial: Tree_Trunk_01
        leafMaterial: Tree_Branches_01
        species: conifer_wide
        scale: 1
        tileIds: [8]
        leafGain: 2
      - scene: /assets/trees/forest-pack/tree-wide-03.glb
        trunkMaterial: Tree_Trunk_01
        leafMaterial: Tree_Branches_01
        species: conifer_wide
        scale: 1
        tileIds: [8]
        leafGain: 2
      - scene: /assets/trees/forest-pack/tree-narrow-01.glb
        trunkMaterial: Tree_Trunk_02
        leafMaterial: Tree_Branches_02
        species: conifer_narrow
        scale: 1
        # A narrow green crown that reads as broadleaf: kept to the boreal biomes,
        # so the bog's conifer stands are the scene's dark spruces.
        tileIds: [9, 10]
        # The forest-pack crowns tile a small leaf texture ~16x per card, so
        # they read as the texture's average: grey sage (wide) and brown
        # (narrow), ~0.05 linear luminance, under the canopy grade's dark-texel
        # guard and kept their raw hue. Brightened they take the shared green
        # ramp; the wide crowns at 2x stay a darker taiga green, the brown
        # narrow one needs 3x to lose its brown.
        leafGain: 3
      # Two genuinely distinct tree geometries extracted from the 42.8 MB whole
      # scene. Its other placements remain saved as individual offline GLBs.
      # These two carry every broadleaf species. `species` is a list because one
      # crown serves several: the registry gives each species its own crown
      # aspect, spacing, trunk proportion and age curve, and the canopy takes the
      # hue of the biome it stands in, so a tropical emergent and a temperate
      # beech read apart without a second mesh. Covering all four broadleaf
      # species here is also what retires the generated lobe-and-cylinder
      # archetypes: they are now built only for a species nothing authored claims.
      - scene: /assets/trees/tree-scene/tree-02.glb
        trunkMaterial: Bark
        leafMaterial: Leaves
        species: [broadleaf_round, tropical_tall]
        barkProfile: beech
        barkScale: 0.9
        barkSeed: 113
        scale: 1
        # The meadow biomes wear grass-test's trees (below); this crown keeps the
        # rainforest, where the donor has nothing of its own.
        tileIds: [7]
      - scene: /assets/trees/tree-scene/tree-03.glb
        trunkMaterial: Bark
        leafMaterial: Leaves
        species: broadleaf_tall
        barkProfile: birch
        barkScale: 0.72
        barkSeed: 127
        scale: 1
        tileIds: [8]
      # grass-test's meadow trees (tree1-tree9), prepared by
      # scripts/prepare-meadow-tree-assets.mjs: billboards stripped, bark UV
      # transforms baked, branches and roots decimated to ~3 500 triangles, leaf
      # cards whole (5 600-14 200 triangles a tree). Donor units are 2.8 to the
      # metre, so `scale: 0.357` keeps its proportions against the character:
      # 6-23 m trees, three to five of the player's heights, as in the donor.
      # Green (7-9): the donor meadow's own trees — curved painted trunks under
      # full green canopies. Savanna through the tropics, the spawn among them.
      - scene: /assets/trees/meadow/tree7.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: [broadleaf_round, broadleaf_tall, tropical_tall]
        scale: 0.357
        tileIds: [3, 4, 5, 6, 7]
        pivot: trunk
      - scene: /assets/trees/meadow/tree8.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: [broadleaf_round, broadleaf_tall, tropical_tall]
        scale: 0.357
        tileIds: [3, 4, 5, 6, 7]
        pivot: trunk
      - scene: /assets/trees/meadow/tree9.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: [broadleaf_round, broadleaf_tall, tropical_tall]
        scale: 0.357
        tileIds: [3, 4, 5, 6, 7]
        pivot: trunk
      # Gold (1-3): the donor's yellow-zone crowns, the deciduous forest's colour.
      - scene: /assets/trees/meadow/tree1.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: [broadleaf_round, broadleaf_tall]
        scale: 0.357
        tileIds: [6]
        pivot: trunk
      - scene: /assets/trees/meadow/tree2.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: [broadleaf_round, broadleaf_tall]
        scale: 0.357
        tileIds: [6]
        pivot: trunk
      - scene: /assets/trees/meadow/tree3.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: [broadleaf_round, broadleaf_tall]
        scale: 0.357
        tileIds: [6]
        pivot: trunk
      # Pale (4-6): the donor's white-zone crowns, silver-green over peeling bark,
      # for the damp biomes and the odd grassland stand.
      - scene: /assets/trees/meadow/tree4.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: broadleaf_tall
        scale: 0.357
        tileIds: [4, 8]
        pivot: trunk
      - scene: /assets/trees/meadow/tree5.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: broadleaf_tall
        scale: 0.357
        tileIds: [4, 8]
        pivot: trunk
      - scene: /assets/trees/meadow/tree6.glb
        trunkMaterial: Meadow bark
        leafMaterial: Meadow leaves
        species: broadleaf_tall
        scale: 0.357
        tileIds: [4, 8]
        pivot: trunk
      # grass-test's alpine conifers (§11 item 6), prepared by
      # scripts/prepare-alpine-tree-assets.mjs: billboards stripped, needles and
      # settled snow merged into one vertex-coloured leaf part, leaves decimated to
      # 2 000 triangles (5 666 and 3 596 in all). The crown keeps its painted snow
      # (COLOR_0), so they stay in tundra; spruces and forest-pack crowns serve taiga.
      - scene: /assets/trees/alpine/tree10.glb
        trunkMaterial: Alpine bark
        leafMaterial: Evergreen needles
        species: conifer_narrow
        scale: 0.357
        tileIds: [10]
        preferredTileIds: [10]
        # Its crown sits ~0.5 m off the stem; enough, at a chunk edge, to put the
        # trunk collider in the neighbouring chunk.
        pivot: trunk
      - scene: /assets/trees/alpine/tree11.glb
        trunkMaterial: Alpine bark
        leafMaterial: Evergreen needles
        species: [conifer_narrow, conifer_wide]
        scale: 0.357
        tileIds: [10]
        preferredTileIds: [10]
        # Windswept: the crown streams ~3 m downwind of the stem, so a bounds pivot
        # would stand the trunk (and its collider) that far off the placement.
        pivot: trunk
      # Grukmar's swamp trees (tools/blender/swamp_trees/build_swamp_trees.py):
      # fluted, buttressed giants forking into a bare twig lattice, sparse dark
      # leaves and hanging moss, plus a broken dead snag. The bog wears nothing
      # else, so its silhouette is its own (docs/plans/swamp-aaa-plan-2026-10-21.md).
      # `canopyGrade: false`: their grey moss and olive leaves keep the painted
      # colour rather than the shared green canopy ramp.
      - scene: /assets/trees/swamp/swamp-giant-01.glb
        trunkMaterial: Swamp bark
        leafMaterial: Swamp leaves
        canopyGrade: false
        species: wetland_sparse
        barkProfile: swamp
        barkScale: 0.7
        barkSeed: 211
        scale: 1
        tileIds: [12]
        pivot: trunk
      - scene: /assets/trees/swamp/swamp-giant-02.glb
        trunkMaterial: Swamp bark
        leafMaterial: Swamp leaves
        canopyGrade: false
        species: wetland_sparse
        barkProfile: swamp
        barkScale: 0.7
        barkSeed: 223
        scale: 1
        tileIds: [12]
        pivot: trunk
      - scene: /assets/trees/swamp/swamp-giant-03.glb
        trunkMaterial: Swamp bark
        leafMaterial: Swamp leaves
        canopyGrade: false
        species: wetland_sparse
        barkProfile: swamp
        barkScale: 0.7
        barkSeed: 227
        scale: 1
        tileIds: [12]
        pivot: trunk
      - scene: /assets/trees/swamp/swamp-snag-01.glb
        trunkMaterial: Swamp bark
        leafMaterial: Swamp leaves
        canopyGrade: false
        species: wetland_sparse
        barkProfile: swamp
        barkScale: 0.7
        barkSeed: 229
        scale: 1
        tileIds: [12]
        pivot: trunk
    # Sparse recognisable plants layered over the shared procedural blade carpet.
    # Each prototype group becomes one instanced object with all of its authored
    # stem/leaf/flower materials intact.
    # Every entry is under 350 triangles. `tileIds` decides which biomes may grow
    # it, `character` weights it toward one ~420 m regional district, and
    # `canopy` toward woodland interior ('core'), woodland fringe ('edge') or
    # open ground ('open'). Heavier extractions — clover at 10 912 triangles and
    # the 2 681-52 188 triangle ground patches — stay offline; their streaming
    # cost was measured and rejected (docs/authored-natural-assets.md).
    groundDetailVariants:

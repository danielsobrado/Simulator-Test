      # --- Pebbles along paths: grass-test's MeadowDetails path stones. -------
      # Its rock pack's pebble shapes (SM_Rocks_06/07/10/11, 54-56 triangles,
      # extracted together as `donor-rock-pebbles`), which the donor keeps at their

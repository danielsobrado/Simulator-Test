name: Post-processing

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/post-processing.yaml'
      - 'src/config/**'
      - 'src/editor/postprocessing/**'
      - 'scripts/run-post-processing-*.mjs'
      - 'test/post-processing-*.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/post-processing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run qa:postprocessing

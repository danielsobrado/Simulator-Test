name: Bake tree impostors once

on:
  push:
    branches:
      - agent/fix-tree-impostor-foliage-mask

permissions:
  contents: write

concurrency:
  group: bake-tree-impostors-once
  cancel-in-progress: false

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tree-impostor-foliage-mask
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build

      - name: Bake and validate v3 atlases
        shell: bash
        run: |
          CHROME_PATH="$(node -e "import('playwright').then(({ chromium }) => process.stdout.write(chromium.executablePath()))")" npm run bake:impostors
          npm run validate:impostors:required

      - name: Commit generated atlases
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bake-tree-impostors-once.yml
          git add public/assets/impostors/trees
          git commit -m "build(impostors): regenerate foliage-mask atlases"
          git push origin HEAD:agent/fix-tree-impostor-foliage-mask

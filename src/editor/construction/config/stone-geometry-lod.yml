version: 1

defaults:
  near:
    mode: legacy
    faceGrid:
      columns: 0
      rows: 0
    bevelRings: 1
    edgeMidpoints: false
    cornerFlattening: false
    reliefAmplitudeScale: 0
    edgeVariationScale: 0

  coarse:
    mode: legacy
    faceGrid:
      columns: 0
      rows: 0
    bevelRings: 1
    edgeMidpoints: false
    cornerFlattening: false
    reliefAmplitudeScale: 0
    edgeVariationScale: 0

  transition:
    hysteresisMetres: 6
    minimumResidenceMs: 500
    crossfade:
      enabled: false
      durationMs: 220
      ditherScale: 1
      maximumConcurrentModules: 4

styles:
  coursed-rubble:
    near:
      mode: soft
      faceGrid:
        columns: 3
        rows: 2
      bevelRings: 2
      edgeMidpoints: true
      cornerFlattening: true
      reliefAmplitudeScale: 1
      edgeVariationScale: 1

    coarse:
      mode: soft-coarse
      faceGrid:
        columns: 1
        rows: 1
      bevelRings: 1
      edgeMidpoints: false
      cornerFlattening: false
      reliefAmplitudeScale: 0.46
      edgeVariationScale: 0.26

    transition:
      hysteresisMetres: 7
      minimumResidenceMs: 600
      crossfade:
        enabled: false
        durationMs: 230
        ditherScale: 1
        maximumConcurrentModules: 3

  soft-limestone-rubble:
    near:
      mode: soft
      faceGrid:
        columns: 3
        rows: 2
      bevelRings: 2
      edgeMidpoints: true
      cornerFlattening: true
      reliefAmplitudeScale: 1
      edgeVariationScale: 1

    coarse:
      mode: soft-coarse
      faceGrid:
        columns: 1
        rows: 1
      bevelRings: 1
      edgeMidpoints: false
      cornerFlattening: false
      reliefAmplitudeScale: 0.55
      edgeVariationScale: 0.32

    transition:
      hysteresisMetres: 8
      minimumResidenceMs: 650
      crossfade:
        enabled: false
        durationMs: 240
        ditherScale: 1
        maximumConcurrentModules: 3
